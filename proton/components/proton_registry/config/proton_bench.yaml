nodes:
  - name: mcu
    id: 0
    endpoints:
      - id: 0
        type: udp4
        ip: 192.168.1.100
        port: 11416
  - name: pc
    id: 1
    endpoints:
      - id: 0
        type: udp4
        ip: 192.168.1.169
        port: 11416

connections:
  - first: {node: mcu, id: 0}
    second: {node: pc, id: 0}

signals:
  - {name: angular_x, id: 0, type: float}
  - {name: angular_y, id: 1, type: float}
  - {name: angular_z, id: 2, type: float}
  - {name: linear_x, id: 3, type: float}
  - {name: linear_y, id: 4, type: float}
  - {name: linear_z, id: 5, type: float}
  - {name: ts_sec, id: 6, type: int64}
  - {name: ts_nsec, id: 7, type: int64}
  - {name: frame_id, id: 8, type: string, value: "esp32_proton_bench"}

bundles:
  - name: imu
    id: 0x100
    producers: [mcu]
    consumers: [pc]
    signals: [0, 1, 2, 3, 4, 5, 6, 7, 8]
